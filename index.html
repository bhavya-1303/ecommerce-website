<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ShopEasy</title>

    <!-- ✅ FIXED CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>🛒 ShopEasy</h1>
      <div class="cart">Cart: <span id="cart-count">0</span></div>

      <!-- ❌ Removed Flask logout -->
      <!-- You can keep a simple link -->
      <div>
        <a href="#" style="color: white; text-decoration: none">Logout</a>
      </div>

      <button onclick="toggleDarkMode()" id="dark-toggle">🌙</button>
    </header>

    <div class="search-box">
      <input type="text" id="search" placeholder="Search products..." />
    </div>

    <div class="filters">
      <button onclick="filterProducts('all')">All</button>
      <button onclick="filterProducts('electronics')">Electronics</button>
      <button onclick="filterProducts('fashion')">Fashion</button>
      <button onclick="filterProducts('accessories')">Accessories</button>
      <button onclick="filterProducts('home')">Home</button>
    </div>

    <section class="products" id="product-list"></section>

    <h2 style="padding-left: 20px">Your Cart</h2>
    <div id="cart-items" style="padding: 20px"></div>

    <h3 style="padding-left: 20px">Total: ₹<span id="total">0</span></h3>

    <h2 style="padding-left: 20px">❤️ Wishlist</h2>
    <div id="wishlist-items" style="padding: 20px"></div>

    <!-- ✅ FIXED JS -->
    <script src="script.js"></script>
  </body>
</html>
